<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив статей · Dude7ox</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <div class="header-wrapper">
            <canvas id="xmbCanvas"></canvas>

            <div class="cover-top">
                <span>DUDE7OX.PERSONAL</span>
                <span>V.1.0 / 2026</span>
            </div>

            <div class="header">
                <div class="jp-strip">
                    <span class="jp-vertical">全記事</span>
                    <span class="jp-mark">ARCHIVE</span>
                </div>

                <div class="brand">
                    <span class="brand-eyebrow">◆ ARCHIVE ◆</span>
                    <h1>АРХИВ</h1>
                    <span class="brand-sub">ВСЕ ЗАПИСИ В ОДНОМ МЕСТЕ</span>
                </div>

                <div class="cover-label">
                    <span>EST. 2026</span>
                    <span>RUS / EN</span>
                    <span>◆◆◆</span>
                </div>
            </div>

            <div class="cover-bottom">
                <span>SYS: READY</span>
            </div>
        </div>

        <div class="breadcrumb">
            <a href="../index.html">← На главную</a> · <a href="index.html">К статьям</a>
        </div>

        <div class="content">
            <h2 class="section-title">
                ВСЕ ЗАПИСИ
                <span class="jp-inline">目録</span>
            </h2>

            <ul class="archive-list" id="archiveList">
                <li style="opacity:0.6;font-size:0.85rem;">Загрузка архива…</li>
            </ul>
        </div>

        <div class="footer">
            © 2026 · Dude7ox · СДЕЛАНО ВРУЧНУЮ
        </div>
    </div>

    <script src="articles.js"></script>

    <script>
        (function renderArchive() {
            const list = document.getElementById('archiveList');
            if (!list) return;

            if (typeof ARTICLES === 'undefined' || !Array.isArray(ARTICLES)) {
                list.innerHTML = '<li style="color:#e8553a;">Не удалось загрузить архив. Проверьте файл articles.js.</li>';
                return;
            }

            list.innerHTML = '';

            const sorted = ARTICLES.slice().sort((a, b) => b.date.localeCompare(a.date));

            sorted.forEach(article => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="${article.id}.html">${article.title}</a>
                    <span class="date">${article.date}</span>
                `;
                list.appendChild(li);
            });
        })();

        const canvas = document.getElementById('xmbCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            if (!canvas.parentElement) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            width = rect.width;
            height = rect.height;
        }
        window.addEventListener('resize', resize);

        const waves = [
            { frequency: 0.004, amplitude: 18, speed:  0.010, opacity: 0.18, phaseShift: 0,             baseHeight: 0.50 },
            { frequency: 0.006, amplitude: 14, speed: -0.008, opacity: 0.12, phaseShift: Math.PI / 3,   baseHeight: 0.68 },
            { frequency: 0.003, amplitude: 24, speed:  0.005, opacity: 0.09, phaseShift: Math.PI / 1.5, baseHeight: 0.85 }
        ];

        const WAVE_COLOR = 'rgba(91, 184, 232, ';
        let increment = 0;

        function animate() {
            if (!width || !height) { requestAnimationFrame(animate); return; }
            ctx.clearRect(0, 0, width, height);

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.fillStyle = WAVE_COLOR + wave.opacity + ')';

                for (let x = 0; x <= width; x++) {
                    const y = (height * wave.baseHeight) +
                              Math.sin(x * wave.frequency + increment * wave.speed + wave.phaseShift) * wave.amplitude +
                              Math.cos(x * 0.001 + increment * 0.005) * (wave.amplitude * 0.3);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                ctx.fill();
            });

            increment += 1;
            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => { resize(); animate(); });
    </script>
</body>
</html>
