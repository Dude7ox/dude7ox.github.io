    <script>
        // ==========================================
        // ВОЛНЫ XMB
        // ==========================================
        const canvas = document.getElementById('xmbCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            if (!canvas.parentElement) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            width = rect.width;
            height = rect.height;
        }
        window.addEventListener('resize', resize);

        const waves = [
            { frequency: 0.004, amplitude: 22, speed:  0.012, opacity: 0.22, phaseShift: 0,             baseHeight: 0.55 },
            { frequency: 0.006, amplitude: 16, speed: -0.009, opacity: 0.16, phaseShift: Math.PI / 3,   baseHeight: 0.70 },
            { frequency: 0.003, amplitude: 28, speed:  0.006, opacity: 0.12, phaseShift: Math.PI / 1.5, baseHeight: 0.85 }
        ];

        const WAVE_COLOR = 'rgba(143, 188, 212, ';

        let increment = 0;

        function animate() {
            if (!width || !height) { requestAnimationFrame(animate); return; }
            ctx.clearRect(0, 0, width, height);

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.fillStyle = WAVE_COLOR + wave.opacity + ')';

                for (let x = 0; x <= width; x++) {
                    const y = (height * wave.baseHeight) +
                              Math.sin(x * wave.frequency + increment * wave.speed + wave.phaseShift) * wave.amplitude +
                              Math.cos(x * 0.001 + increment * 0.005) * (wave.amplitude * 0.3);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                ctx.fill();
            });

            increment += 1;
            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => { resize(); animate(); });
    </script>
