<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи · Dude7ox</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <div class="header-wrapper">
            <canvas id="xmbCanvas"></canvas>
            <div class="header">
                <h1>▓▒░ СТАТЬИ ░▒▓</h1>
                <p>ЗАМЕТКИ · МЫСЛИ · ТЕКСТЫ</p>
            </div>
        </div>

        <div class="breadcrumb">
            <a href="../index.html">← На главную</a>
        </div>

        <div class="content">
            <section class="hero">
                <p>
                    Здесь я публикую статьи и заметки. Ниже — последние записи.
                    Полный список можно посмотреть в <a href="archive.html">архиве</a>.
                </p>
            </section>

            <h2 class="section-title">ПОСЛЕДНИЕ ЗАПИСИ</h2>

            <div class="grid" id="articlesGrid">
                <p style="opacity:0.6;font-size:0.85rem;">Загрузка статей…</p>
            </div>

            <h2 class="section-title">АРХИВ</h2>
            <section class="hero">
                <p>
                    Хочешь посмотреть всё сразу? <a href="archive.html">Открыть архив всех статей →</a>
                </p>
            </section>
        </div>

        <div class="footer">
            © 2026 · Dude7ox · СДЕЛАНО ВРУЧНУЮ
        </div>
    </div>

    <!-- Подключаем список статей -->
    <script src="articles.js"></script>

    <script>
        // ==========================================
        // ОТРИСОВКА ПОСЛЕДНИХ СТАТЕЙ
        // ==========================================
        (function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            if (!grid) return;

            if (typeof ARTICLES === 'undefined' || !Array.isArray(ARTICLES)) {
                grid.innerHTML = '<p style="color:#e8c76b;">Не удалось загрузить список статей. Проверьте файл articles.js.</p>';
                return;
            }

            grid.innerHTML = '';

            // Сортируем по дате — сначала новые
            const sorted = ARTICLES.slice().sort((a, b) => b.date.localeCompare(a.date));
            const lastThree = sorted.slice(0, 3);

            lastThree.forEach(article => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="icon">[ ${article.number} ]</div>
                    <h3>${article.title}</h3>
                    <p>${article.description}</p>
                    <a href="${article.id}.html">Читать →</a>
                `;
                grid.appendChild(card);
            });
        })();

        // ==========================================
        // ВОЛНЫ XMB
        // ==========================================
        const canvas = document.getElementById('xmbCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            if (!canvas.parentElement) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            width = rect.width;
            height = rect.height;
        }
        window.addEventListener('resize', resize);

        const waves = [
            { baseHeight: 0.70, amplitude: 18, speed: 0.006,  frequency: 0.004, phase: 0, opacity: 0.30, thickness: 2.5, glow: 14 },
            { baseHeight: 0.78, amplitude: 14, speed: -0.005, frequency: 0.006, phase: 2, opacity: 0.25, thickness: 2.0, glow: 12 },
            { baseHeight: 0.85, amplitude: 20, speed: 0.003,  frequency: 0.003, phase: 4, opacity: 0.20, thickness: 3.0, glow: 18 },
            { baseHeight: 0.90, amplitude: 10, speed: -0.008, frequency: 0.008, phase: 1, opacity: 0.35, thickness: 1.5, glow: 10 },
            { baseHeight: 0.95, amplitude: 15, speed: 0.004,  frequency: 0.005, phase: 3, opacity: 0.25, thickness: 2.2, glow: 13 }
        ];

        function animate() {
            if (!width || !height) { requestAnimationFrame(animate); return; }
            ctx.clearRect(0, 0, width, height);
            waves.forEach(wave => {
                ctx.beginPath();
                ctx.lineWidth = wave.thickness;
                ctx.strokeStyle = `rgba(180, 220, 255, ${wave.opacity})`;
                ctx.lineCap = 'round';
                ctx.shadowBlur = wave.glow;
                ctx.shadowColor = `rgba(120, 190, 240, ${wave.opacity + 0.2})`;
                wave.phase += wave.speed;
                for (let x = 0; x <= width; x += 4) {
                    const y = (height * wave.baseHeight) +
                              Math.sin(x * wave.frequency + wave.phase) * wave.amplitude +
                              Math.sin(x * (wave.frequency * 0.5) + (wave.phase * 0.7)) * (wave.amplitude * 0.4);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => { resize(); animate(); });
    </script>
</body>
</html>
